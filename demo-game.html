<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>חייל בורח מהרס"ר</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a2a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      font-family: 'Arial', 'Helvetica', sans-serif;
      overflow: hidden;
      direction: rtl;
      user-select: none;
    }

    #hud {
      width: 390px;
      max-width: 100vw;
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      gap: 8px;
      flex-shrink: 0;
    }

    #lives-display { font-size: 15px; letter-spacing: 2px; min-width: 54px; }

    #sgt-bar-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 16px;
    }
    #sgt-bar {
      flex: 1;
      height: 9px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
    }
    #sgt-fill {
      height: 100%;
      background: linear-gradient(90deg, #f39c12, #e74c3c);
      width: 20%;
      border-radius: 5px;
      transition: width 0.4s;
    }

    #timer-display {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: #aed6f1;
      min-width: 40px;
      text-align: center;
    }

    #game-canvas {
      display: block;
      max-width: 100vw;
      touch-action: none;
    }

    /* ---- Overlays ---- */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.72);
      z-index: 20;
      direction: rtl;
    }
    .overlay.hidden { display: none; }

    .overlay-box {
      background: #1e3a0e;
      border: 2px solid #8B7355;
      border-radius: 18px;
      padding: 22px 20px;
      text-align: center;
      color: #f0e6d0;
      max-width: 340px;
      width: 92%;
      direction: rtl;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .overlay-box h1 { font-size: 22px; margin-bottom: 10px; }
    .overlay-box h2 { font-size: 20px; margin-bottom: 10px; }
    .overlay-box p  { font-size: 14px; line-height: 1.55; margin-bottom: 7px; color: #ccc; }

    .btn-game {
      background: #5a7a30;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      font-family: inherit;
      letter-spacing: 0.3px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-game:active { transform: scale(0.97); }
    .btn-game:hover  { background: #6b9038; }

    /* ---- Question ---- */
    #question-text {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 14px;
      line-height: 1.45;
      color: #fff;
    }

    #answer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ans-btn {
      background: #2d5016;
      color: #eee;
      border: 2px solid #5a7a30;
      border-radius: 9px;
      padding: 11px 7px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s;
      direction: rtl;
      line-height: 1.3;
    }
    .ans-btn:hover:not(:disabled) { background: #3d6a1e; }
    .ans-btn:disabled { cursor: default; }
    .ans-btn.correct  { background: #1e7e34; border-color: #28a745; }
    .ans-btn.wrong    { background: #8b1a1a; border-color: #dc3545; }

    #feedback-msg {
      font-size: 15px;
      font-weight: bold;
      min-height: 20px;
      margin-bottom: 5px;
    }
    #feedback-msg.correct { color: #5dff88; }
    #feedback-msg.wrong   { color: #ff6b6b; }

    #explanation-text {
      font-size: 12px;
      color: #aaa;
      min-height: 14px;
    }

    @media (max-width: 400px) {
      #hud { font-size: 12px; padding: 6px 8px; }
      .overlay-box { padding: 16px 14px; }
      .ans-btn { font-size: 13px; padding: 9px 5px; }
    }
  </style>
</head>
<body>

<div id="hud">
  <div id="lives-display">❤️❤️❤️</div>
  <div id="sgt-bar-wrap">
    <span title="הרס&quot;ר">😤</span>
    <div id="sgt-bar"><div id="sgt-fill"></div></div>
    <span title="ספר">✂️</span>
  </div>
  <div id="timer-display">00:00</div>
</div>

<canvas id="game-canvas" width="390" height="575"></canvas>

<!-- Start Screen -->
<div id="start-screen" class="overlay">
  <div class="overlay-box">
    <h1>🏃 חייל בורח מהרס"ר ✂️</h1>
    <p>הרס"ר שם עינו עליך — עשיר שנה שלא הסתפרת!</p>
    <p>קפוץ מעל מכשולים, ענה נכון על שאלות, והגע לספר לפני שייתפס!</p>
    <p style="color:#888;font-size:12px;">Space / נגיעה על המסך = קפיצה</p>
    <button class="btn-game" id="start-btn">התחל לרוץ! 🏃</button>
  </div>
</div>

<!-- Question Overlay -->
<div id="question-overlay" class="overlay hidden">
  <div class="overlay-box">
    <p style="font-size:11px;color:#888;margin-bottom:8px;">⏸ הרס"ר מחכה... ענה מהר!</p>
    <div id="question-text"></div>
    <div id="answer-buttons"></div>
    <div id="feedback-msg"></div>
    <div id="explanation-text"></div>
  </div>
</div>

<!-- Game Over Screen -->
<div id="gameover-screen" class="overlay hidden">
  <div class="overlay-box">
    <h2 id="gameover-title"></h2>
    <p id="gameover-desc"></p>
    <div id="final-score" style="font-size:19px;margin:12px 0;font-weight:bold;"></div>
    <button class="btn-game" id="restart-btn">שחק שוב 🔄</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIG VARIABLES
============================================================ */
var questionsSource = [
  { q: 'כמה חודשים יש בשנה?',           a: ['10','11','12','13'],                              c: 2, explanation: '12 חודשים בשנה' },
  { q: 'מה עיר הבירה של ישראל?',         a: ['תל אביב','ירושלים','חיפה','באר שבע'],             c: 1, explanation: 'ירושלים היא עיר הבירה' },
  { q: 'כמה שניות יש בדקה?',             a: ['30','45','60','90'],                              c: 2, explanation: '60 שניות בדקה' },
  { q: 'מה צבע הדגל הישראלי?',           a: ['אדום ולבן','כחול ולבן','ירוק ולבן','שחור ולבן'], c: 1, explanation: 'הדגל הישראלי כחול ולבן' },
  { q: 'כמה ימים יש בשבוע?',             a: ['5','6','7','8'],                                  c: 2, explanation: '7 ימים בשבוע' },
  { q: 'כמה אצבעות יש בשתי הידיים?',    a: ['8','9','10','12'],                                c: 2, explanation: '5×2 = 10 אצבעות' },
  { q: 'מה קורה לרס"ר כשאתה עונה נכון?', a: ['מתרגז','מתרחק','מתקרב','ישן'],                   c: 1, explanation: 'תשובה נכונה = הרס"ר מתרחק!' },
  { q: 'כמה שעות יש ביממה?',             a: ['12','18','24','36'],                              c: 2, explanation: '24 שעות ביממה' }
];
var MAX_LIVES        = 3;
var GAME_TIMER       = 0;
var SHOW_FEEDBACK    = true;
var FEEDBACK_DURATION = 2;
var CORRECT_FEEDBACK  = 'כל הכבוד! הרס"ר מתרחק 💨';
var INCORRECT_FEEDBACK = 'טעות! הרס"ר מתקרב 😤';

/* ============================================================
   MOODLE CONFIG
============================================================ */
function applyMoodleConfig(cfg) {
  if (!cfg) return;
  if (cfg.questions) {
    questionsSource = cfg.questions.map(function(q) {
      return {
        q: q.q,
        a: q.options || q.a,
        c: q.correct !== undefined ? q.correct : q.c,
        explanation: q.explanation || ''
      };
    });
  }
  if (cfg.lives !== undefined)          MAX_LIVES         = cfg.lives;
  if (cfg.timer !== undefined)          GAME_TIMER        = cfg.timer;
  if ('showFeedback' in cfg)            SHOW_FEEDBACK     = cfg.showFeedback;
  if (cfg.feedbackDuration !== undefined) FEEDBACK_DURATION = parseInt(cfg.feedbackDuration) || FEEDBACK_DURATION;
  if (cfg.correctFeedback !== undefined)  CORRECT_FEEDBACK  = cfg.correctFeedback;
  if (cfg.incorrectFeedback !== undefined) INCORRECT_FEEDBACK = cfg.incorrectFeedback;
}

try { applyMoodleConfig(window.parent.moodleGameConfig); } catch(e) {}

/* ============================================================
   CANVAS & CONSTANTS
============================================================ */
var canvas  = document.getElementById('game-canvas');
var ctx     = canvas.getContext('2d');
var W       = canvas.width;
var H       = canvas.height;
var GROUND  = Math.floor(H * 0.69);
var OBS_PER_QUESTION = 3;
var WIN_SCORE = questionsSource.length;

/* ============================================================
   GAME STATE
============================================================ */
var gs = {
  lives: MAX_LIVES,
  score: 0,
  timerMs: 0,
  prevTs: 0,
  running: false,
  paused: false,
  sgtProximity: 20,
  obstaclesCleared: 0,
  pool: [],
  poolIdx: 0,
  fbTimeout: null,
  rafId: null
};

var soldier = { x: 78, y: GROUND - 46, vy: 0, jumping: false, frame: 0, frameMs: 0 };
var obstacles = [];
var obsTimer = 0;
var bgScroll = 0;
var cloudX = W;

/* ============================================================
   QUESTION POOL
============================================================ */
function shuffle(arr) {
  var a = arr.slice(), i, j, t;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function initPool() {
  gs.pool   = shuffle(questionsSource);
  gs.poolIdx = 0;
}

function nextQuestion() {
  if (gs.poolIdx >= gs.pool.length) { gs.pool = shuffle(questionsSource); gs.poolIdx = 0; }
  return gs.pool[gs.poolIdx++];
}

/* ============================================================
   DRAWING
============================================================ */
function drawBg() {
  // Sky
  var sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#5a8fc0');
  sky.addColorStop(1, '#aed6f1');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND);

  // Sun
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.arc(W - 48, 38, 26, 0, Math.PI * 2);
  ctx.fill();

  // Cloud
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  var cx = cloudX % (W + 120) - 60;
  ctx.beginPath(); ctx.ellipse(cx, 55, 36, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 28, 50, 26, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx - 22, 50, 22, 12, 0, 0, Math.PI * 2); ctx.fill();

  // Distant barracks (static)
  ctx.fillStyle = '#7a9060';
  ctx.fillRect(0, GROUND - 70, W, 70);

  // Fence posts (scrolling)
  ctx.fillStyle = '#4a5e30';
  var sp = 68, off = bgScroll % sp;
  for (var px = -off; px < W; px += sp) {
    ctx.fillRect(px,     GROUND - 56, 7, 46);
    ctx.fillRect(px - 4, GROUND - 53, 15, 6);
  }

  // Ground
  var grd = ctx.createLinearGradient(0, GROUND, 0, H);
  grd.addColorStop(0, '#8B7355');
  grd.addColorStop(1, '#5e4a2a');
  ctx.fillStyle = grd;
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#4A5E3A';
  ctx.fillRect(0, GROUND, W, 5);
}

function drawSoldier() {
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(soldier.x, GROUND + 3, 19, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = '40px serif';
  ctx.fillText('🏃', soldier.x - 20, soldier.y + 40);
}

function drawObstacles() {
  var types = ['📦', '🛢️', '🪖'];
  ctx.font = '36px serif';
  for (var i = 0; i < obstacles.length; i++) {
    ctx.fillText(types[obstacles[i].type], obstacles[i].x, obstacles[i].y + 36);
  }
}

function drawSergeant() {
  var p  = gs.sgtProximity / 100;
  var sx = W - 18 - p * 90;
  var sz = 22 + p * 22;
  ctx.globalAlpha = 0.28 + p * 0.72;
  ctx.font = sz + 'px serif';
  ctx.fillText('😤', sx, GROUND + 2);
  ctx.globalAlpha = 1;
}

function drawBarber() {
  ctx.font = '26px serif';
  ctx.fillText('✂️', 8, GROUND - 8);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 10px Arial';
  ctx.fillText('ספר', 8, GROUND + 14);
}

function drawProgressBar() {
  // small "reach barber" bar at bottom
  var pct = Math.min(1, gs.score / WIN_SCORE);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(8, H - 14, W - 16, 8);
  ctx.fillStyle = '#5dff88';
  ctx.fillRect(8, H - 14, (W - 16) * pct, 8);
  ctx.fillStyle = '#fff';
  ctx.font = '9px Arial';
  ctx.fillText('התקדמות אל הספר', W / 2 - 38, H - 6);
}

/* ============================================================
   HUD UPDATE (DOM)
============================================================ */
function updateHUD() {
  var hearts = '';
  for (var i = 0; i < MAX_LIVES; i++) hearts += (i < gs.lives ? '❤️' : '🖤');
  document.getElementById('lives-display').textContent = hearts || '💀';

  document.getElementById('sgt-fill').style.width = gs.sgtProximity + '%';

  var secs = Math.floor(gs.timerMs / 1000);
  var displaySecs;
  if (GAME_TIMER > 0) {
    displaySecs = Math.max(0, GAME_TIMER - secs);
    if (displaySecs <= 0 && gs.running && !gs.paused) { endGame(false, 'נגמר הזמן!'); return; }
  } else if (GAME_TIMER === 0) {
    displaySecs = secs;
  } else {
    displaySecs = secs;
  }
  var m = Math.floor(displaySecs / 60), s = displaySecs % 60;
  document.getElementById('timer-display').textContent =
    (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

/* ============================================================
   GAME LOOP
============================================================ */
function loop(ts) {
  if (!gs.running) return;

  var dt = gs.prevTs ? Math.min(ts - gs.prevTs, 80) : 16;
  gs.prevTs = ts;

  if (!gs.paused) {
    gs.timerMs    += dt;
    bgScroll      += dt * 0.13;
    cloudX        -= dt * 0.04;

    // Sergeant creeps closer
    gs.sgtProximity = Math.min(100, gs.sgtProximity + dt * 0.005);
    if (gs.sgtProximity >= 100) { endGame(false, 'הרס"ר תפס אותך!'); return; }

    // Obstacle spawning (speeds up with score)
    obsTimer += dt;
    var interval = Math.max(700, 2200 - gs.score * 80);
    if (obsTimer >= interval) {
      obsTimer = 0;
      obstacles.push({ x: W + 10, y: GROUND - 36, type: Math.floor(Math.random() * 3) });
    }

    // Soldier physics — dt-normalised to 60fps
    if (soldier.jumping || soldier.y < GROUND - 46) {
      var dtF = dt / 16.67;
      soldier.vy += 0.7 * dtF;
      soldier.y  += soldier.vy * dtF;
      if (soldier.y >= GROUND - 46) {
        soldier.y      = GROUND - 46;
        soldier.vy     = 0;
        soldier.jumping = false;
      }
    }
    soldier.frameMs += dt;
    if (soldier.frameMs > 220) { soldier.frame = 1 - soldier.frame; soldier.frameMs = 0; }

    // Move obstacles & check
    var speed = 3 + gs.score * 0.25;
    var sl = soldier.x - 14, sr = soldier.x + 14;
    var sb = soldier.y + 46,  st = soldier.y + 4;

    for (var i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= speed * (dt / 16);
      var o = obstacles[i];
      if (o.x + 38 < 0) {
        obstacles.splice(i, 1);
        gs.obstaclesCleared++;
        if (gs.obstaclesCleared % OBS_PER_QUESTION === 0) { showQuestion(); return; }
        continue;
      }
      // Collision
      if (sr > o.x + 6 && sl < o.x + 30 && sb > o.y + 6 && st < o.y + 32) {
        obstacles.splice(i, 1);
        hitObstacle();
        return;
      }
    }
  }

  // Draw
  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawBarber();
  drawObstacles();
  drawSoldier();
  drawSergeant();
  drawProgressBar();
  updateHUD();

  gs.rafId = requestAnimationFrame(loop);
}

/* ============================================================
   JUMP
============================================================ */
function jump() {
  if (!gs.running || gs.paused) return;
  if (!soldier.jumping && soldier.y >= GROUND - 52) {
    soldier.vy = -22;
    soldier.jumping = true;
  }
}

/* ============================================================
   HIT / LOSE LIFE
============================================================ */
function hitObstacle() {
  gs.lives--;
  gs.sgtProximity = Math.min(100, gs.sgtProximity + 18);
  var _secs = Math.floor(gs.timerMs / 1000);
  try { window.parent.postMessage({ type: 'SCORE_UPDATE', score: gs.score, timer: _secs, isfinished: false }, '*'); } catch(e) {}
  // count toward question trigger even on hits
  gs.obstaclesCleared++;
  canvas.style.filter = 'brightness(0.25)';
  setTimeout(function() { canvas.style.filter = ''; }, 280);
  if (gs.lives <= 0) { endGame(false, 'כל החיים נגמרו!'); return; }
  if (gs.obstaclesCleared % OBS_PER_QUESTION === 0) { showQuestion(); return; }
  gs.rafId = requestAnimationFrame(loop);
}

/* ============================================================
   QUESTIONS
============================================================ */
function showQuestion() {
  gs.paused = true;
  var q = nextQuestion();
  document.getElementById('question-overlay').classList.remove('hidden');
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('feedback-msg').textContent = '';
  document.getElementById('feedback-msg').className   = '';
  document.getElementById('explanation-text').textContent = '';

  var btnsEl = document.getElementById('answer-buttons');
  btnsEl.innerHTML = '';
  q.a.forEach(function(ans, idx) {
    var btn = document.createElement('button');
    btn.className   = 'ans-btn';
    btn.textContent = ans;
    btn.onclick     = function() { answer(idx, q); };
    btnsEl.appendChild(btn);
  });

  gs.rafId = requestAnimationFrame(loop);
}

function answer(chosen, q) {
  document.querySelectorAll('.ans-btn').forEach(function(b, i) {
    b.disabled = true;
    if (i === q.c)      b.classList.add('correct');
    else if (i === chosen) b.classList.add('wrong');
  });

  var correct  = (chosen === q.c);
  var fbEl     = document.getElementById('feedback-msg');
  var explEl   = document.getElementById('explanation-text');

  if (correct) {
    gs.score++;
    gs.sgtProximity = Math.max(0, gs.sgtProximity - 28);
    if (SHOW_FEEDBACK) { fbEl.textContent = CORRECT_FEEDBACK; fbEl.className = 'correct'; }
    var _sc = Math.floor(gs.timerMs / 1000);
    try { window.parent.postMessage({ type: 'SCORE_UPDATE', score: gs.score, timer: _sc, isfinished: false }, '*'); } catch(e) {}
    if (gs.score >= WIN_SCORE) {
      document.getElementById('question-overlay').classList.add('hidden');
      endGame(true, '');
      return;
    }
  } else {
    gs.lives--;
    gs.sgtProximity = Math.min(100, gs.sgtProximity + 22);
    if (SHOW_FEEDBACK) { fbEl.textContent = INCORRECT_FEEDBACK; fbEl.className = 'wrong'; }
    var _sw = Math.floor(gs.timerMs / 1000);
    try { window.parent.postMessage({ type: 'SCORE_UPDATE', score: gs.score, timer: _sw, isfinished: false }, '*'); } catch(e) {}
  }

  if (SHOW_FEEDBACK && q.explanation) explEl.textContent = q.explanation;

  var delay = SHOW_FEEDBACK ? FEEDBACK_DURATION * 1000 : 350;
  if (gs.fbTimeout) clearTimeout(gs.fbTimeout);
  gs.fbTimeout = setTimeout(function() {
    document.getElementById('question-overlay').classList.add('hidden');
    if (gs.lives <= 0)           { endGame(false, 'כל החיים נגמרו!'); return; }
    if (gs.sgtProximity >= 100)  { endGame(false, 'הרס"ר תפס אותך!');  return; }
    gs.paused  = false;
    gs.prevTs  = 0;
  }, delay);
}

/* ============================================================
   END GAME
============================================================ */
function endGame(won, reason) {
  gs.running = false;
  gs.paused  = false;
  var secs = Math.floor(gs.timerMs / 1000);
  try { window.parent.postMessage({ type: 'SCORE_UPDATE', score: gs.score, timer: secs, isfinished: true }, '*'); } catch(e) {}

  var m = Math.floor(secs / 60), s = secs % 60;
  var t = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;

  document.getElementById('gameover-title').textContent = won ? '🎉 הגעת לספר!' : ('😤 ' + reason);
  document.getElementById('gameover-desc').textContent  = won ? 'מה מסתפר! הרס"ר לא הספיק לראות אותך.' : 'הרס"ר מנצח הפעם... נסה שוב!';
  document.getElementById('final-score').textContent    = 'ניקוד: ' + gs.score + ' | זמן: ' + t;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

/* ============================================================
   START / RESTART
============================================================ */
function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('question-overlay').classList.add('hidden');

  WIN_SCORE = questionsSource.length;

  gs.lives           = MAX_LIVES;
  gs.score           = 0;
  gs.timerMs         = 0;
  gs.prevTs          = 0;
  gs.running         = true;
  gs.paused          = false;
  gs.sgtProximity    = 20;
  gs.obstaclesCleared = 0;
  gs.poolIdx         = 0;
  if (gs.fbTimeout) clearTimeout(gs.fbTimeout);

  soldier.y       = GROUND - 46;
  soldier.vy      = 0;
  soldier.jumping = false;
  soldier.frame   = 0;

  obstacles.length = 0;
  obsTimer  = 0;
  bgScroll  = 0;
  cloudX    = W;

  initPool();

  try { window.parent.postMessage({ type: 'GAME_START' }, '*'); } catch(e) {}

  if (gs.rafId) cancelAnimationFrame(gs.rafId);
  gs.rafId = requestAnimationFrame(loop);
}

/* ============================================================
   EVENTS
============================================================ */
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
    e.preventDefault();
    jump();
  }
});

canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', function(e) { e.preventDefault(); jump(); }, { passive: false });

/* ============================================================
   INITIAL STATIC FRAME
============================================================ */
(function() {
  var sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#5a8fc0');
  sky.addColorStop(1, '#aed6f1');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8B7355';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#4A5E3A';
  ctx.fillRect(0, GROUND, W, 5);
  ctx.font = '40px serif';
  ctx.fillText('🏃', soldier.x - 20, GROUND - 6);
}());
</script>
